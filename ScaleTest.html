<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>

<head>
    <title>規模測試 Scale Test</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="stylesheet" href="css/animate.min.css">

    <script src="lib/jquery-2.1.3.min.js"></script>
    <script src="lib/d3.min.js"></script>
    <script src="lib/bootstrap.min.js"></script>
    <script src="lib/FileSaver.min.js"></script>
    <script src="lib/jquery.hotkeys.js"></script>

    <!--JavaScript-->
    <script src="js/palacelayout/models/Rule.js"></script>
    <script src="js/Space.js"></script>
    <script src="js/Stage.js"></script>
    <script src="js/palacelayout/controllers/ScaleTestCtrler.js"></script>
    <script src="js/palacelayout/models/DoubleGrooveModel.js"></script>
    <script src="js/Command.js"></script>
    <script src="js/VerifiedFunction.js"></script>
    <script src="js/Colors.js"></script>
    <script src="js/CommandManager.js"></script>
    <script src="js/canvas/models/Observer.js"></script>
    <script src="js/PaintTemplates.js"></script>
    <script src="js/FileHandler.js"></script>
    <script src="js/UIAnimater.js"></script>

</head>

<body>
    <div id="header" class="header">
        <ul class="nav nav-pills">
            <li class="dropdown">
                <a href="#" class="dropdown-toggle" data-toggle="dropdown" data-submenu>
                    <font style="color: DodgerBlue;" size="3">File</font><span class="caret"></span>
                </a>
                <ul class="dropdown-menu">
                    <li class="dropdown-submenu">
                        <a href="#">
                            <font size="3">Export</font>
                        </a>
                        <ul class="dropdown-menu">
                            <li><a href="#" onclick="exportSvgFile()">
                                    <font size="3">2D SVG model</font>
                                </a></li>
                            <li><a href="#" onclick="exportStlFile()">
                                    <font size="3">3D STL model</font>
                                </a></li>
                            <li><a href="#" onclick="exportX3dFile(false)">
                                    <font size="3">3D X3D model</font>
                                </a></li>
                            <li><a href="#" onclick="exportX3dFile(true)">
                                    <font size="3">3D X3D model (DEF/USE)</font>
                                </a></li>
                        </ul>
                    </li>
                </ul>
            </li>

            <li><a href="#" data-toggle="modal" data-target="#myModalNew"><span id="New" style="display: block;">
                        <font style="-webkit-animation: hue 60s infinite linear;" size="3">New</font>
                    </span></a></li>
            <li><a href="#" name="Previous_step" onclick="doPreviousStep()">
                    <font style="color: DodgerBlue;" size="3">Previous step</font>
                </a></li>
            <li><a href="#" name="Next_step" onclick="doNextStep()"><span id="NextStep" style="display: block;">
                        <font style="-webkit-animation: hue 60s infinite linear;" size="3">Next step</font>
                    </span></a></li>
            <li><a href="#" onclick="doSkiptoNextStage()"><span id="NextStage" style="display: block;">
                        <font style="-webkit-animation: hue 60s infinite linear;" size="3">Resume</font>
                    </span></a></li>
        </ul>
    </div>

    <div class="modal fade" id="myModalNew" tabindex="-1" role="dialog" aria-labelledby="myModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
                    <h4 class="modal-title">Input size of layout map.</h4>
                </div>
                <p class="text-center">Width: <input type="text" name="LayoutWidth" value="9">
                    Height: <input type="text" name="LayoutHeight" value="6"></p>
                <p class="text-center">分槽 Groove:
                    <select name="GrooveRules">
                        <option value="double">單槽／雙槽 Single / Dual Groove (Rule 9, 11)</option>
                        <option value="box">金箱枓底槽 Box Groove (Rule 9–12)</option>
                        <option value="bottom">分心枓底槽 Bottom Groove (Rule 8)</option>
                        <option value="none">不分槽 None</option>
                    </select></p>
                <p class="text-center">每步間隔 Delay per step (ms): <input type="text" name="StepDelay" value="100" size="5"></p>
                <div class="modal-footer">
                    <div style="float:left; text-align:left">
                        <label class="checkbox-inline"><input type="checkbox" name="SideCorridor" checked><font size="3">Side Corridor(副階)</font></label>
                        <br>
                        <label class="checkbox-inline"><input type="checkbox" name="FitView" checked><font size="3">鏡頭拉遠看見整棟 Fit whole building in view</font></label>
                        <br>
                        <label class="checkbox-inline"><input type="checkbox" name="PausePreview" checked><font size="3">Resume 時暫停 3D 預覽（較快）Pause preview while generating</font></label>
                    </div>
                    <button type="button" class="btn btn-primary" onclick="createNewLayoutMap()" data-dismiss="modal">Create</button>
                    <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
                </div>
            </div><!-- /.modal-content -->
        </div><!-- /.modal-dialog -->
    </div><!-- /.modal -->

    <div id="space" class="space"></div>

    <div id="canvas_container" class="canvas_container">
        <iframe id="viewer" allowfullscreen onmousewheel src="Canvas.html"></iframe>
    </div>

</body>

</html>
